# conda env create -f kit/environment.yml && conda activate hpoly-vaf
name: hpoly-vaf
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pysam
  - numpy
  - scipy
  - pytest
  - samtools
  - htslib
  - git
  - cmake
  - make
  - gxx_linux-64=13
  - gcc_linux-64=13
  - zlib
  - openblas
